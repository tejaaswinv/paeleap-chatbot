name: Application checks
on:
  push:
    branches: [main, frontend, feature/ai-backend-day1, feature/frontend-chat, feature/tourmate-production-hardened]
  pull_request:
    branches: [main]

# CI never needs write access to the repository or user secrets.
permissions:
  contents: read

# Replaced pushes/PR updates should not consume unnecessary runner minutes.
concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run faq:check
      - run: npm audit --audit-level=high
      - run: npm run test:syntax
      - run: npm test
      - run: npm run test:redteam -- --out reports/redteam-ci.json
      - run: npm run test:redteam -- --mode provider-adversarial --out reports/redteam-provider-fixture-ci.json
      - run: npm run test:remediation -- --strict --out reports/remediation-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-redteam-evidence
          path: reports/*-ci.json
          retention-days: 30
      - run: npm run build
